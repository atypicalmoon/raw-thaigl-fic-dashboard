<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>人工核对管理台 · ReadAWrite</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <a class="admin-brand" href="../index.html"><span class="brand-mark">GL</span><span><b>ReadAWrite</b><small>人工核对管理台</small></span></a>
    <div class="header-actions"><a href="../index.html">返回看板</a><button id="logoutButton" type="button" hidden>退出</button></div>
  </header>

  <main class="admin-shell">
    <section class="intro">
      <p class="eyebrow">PRIVATE REVIEW DESK</p>
      <h1>只处理系统无法判断的 CP 冲突。</h1>
      <p>选择最终决定后直接提交；草稿仍在待处理，云端更新完成后才显示为已生效。</p>
    </section>

    <section class="login-card" id="loginCard" hidden>
      <div><span class="eyebrow">需要登录</span><h2>进入维护空间</h2><p id="loginHint">输入管理密码。</p></div>
      <form id="loginForm"><label for="loginPassword">管理密码</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="输入密码"><button class="primary" type="submit">登录</button><p class="form-message" id="loginMessage" role="status"></p></form>
    </section>

    <section id="app" hidden>
      <div class="summary-grid">
        <button class="summary-card active" data-kind="pending" type="button"><span>待处理</span><strong id="pendingCount">0</strong><small>含未提交修改</small></button>
        <button class="summary-card" data-kind="results" type="button"><span>处理结果</span><strong id="resultsCount">0</strong><small>已提交与已生效</small></button>
      </div>

      <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="管理台分区">
          <button class="tab active" data-kind="pending" type="button">待处理</button>
          <button class="tab" data-kind="results" type="button">处理结果</button>
        </div>
        <div class="toolbar-row"><label class="search"><span>搜索</span><input id="searchInput" type="search" placeholder="标题 / CP / 标签"></label><button class="secondary" id="refreshButton" type="button">刷新</button></div>
      </div>

      <div class="filter-strip" aria-label="筛选条件">
        <label><span>状态</span><select id="stateFilter"><option value="">全部</option><option value="pending">未选择</option><option value="draft">未提交修改</option></select></label>
        <label><span>CP</span><select id="cpFilter"><option value="">全部 CP</option></select></label>
        <label><span>时间</span><select id="dateFilter"><option value="">全部时间</option></select></label>
        <button class="secondary" id="clearFilters" type="button">清除筛选</button>
        <span class="flow-note">选择决定 → 自动保存 → 提交所选</span>
      </div>

      <div class="selection-bar" id="selectionBar"><span id="selectionSummary">尚未选择</span><button class="primary" id="submitButton" type="button" disabled>提交所选</button></div>
      <section class="review-list" id="reviewList" aria-live="polite"></section>
      <section class="history-list" id="resultList" hidden></section>
    </section>

    <p class="global-message" id="globalMessage" role="status"></p>
  </main>
  <script src="admin.js"></script>
</body>
</html>
